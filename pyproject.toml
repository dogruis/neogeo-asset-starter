[project]
name = "neogeo-asset-starter"
version = "0.1.0"
description = "Build-time asset pipeline for Neo Geo homebrew made with ngdevkit"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["Tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "RUF"]
ignore = ["E501"]
